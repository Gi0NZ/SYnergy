site_name: SYnergy Python Bindings
site_description: Python bindings for SYnergy energy-aware SYCL queues through dpctl
site_author: Giovanni / Nicolò Gallotta

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - python
          options:
            docstring_style: numpy
            show_source: true
            show_signature_annotations: true
            members_order: source

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Queue and Profiling: device_profiling.md
  - Device Management: frequency_scaling.md
  - Direct Kernel: direct_kernel.md
  - API Reference: api.md
  - Limitations: limitations.md
  